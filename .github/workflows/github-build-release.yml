name: Build and create release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.8.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release binary
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: semeru
          cache: maven
      - name: Get project version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
      - name: Build
        run: mvn --batch-mode package
      - name: Create release if it does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --title "Release $TAG" --generate-notes --verify-tag \
              || gh release view "$TAG" >/dev/null   # tolerate race with a UI-created release
          fi
      - name: Upload release assets (overwrite if present)
        run: |
          gh release upload "$TAG" --clobber \
            "target/kafka-connect-mq-source-${VERSION}-jar-with-dependencies.jar" \
            "target/kafka-connect-mq-source-${VERSION}-dependencies-exc-mq.jar" \
            "target/kafka-connect-mq-source-${VERSION}.jar"
