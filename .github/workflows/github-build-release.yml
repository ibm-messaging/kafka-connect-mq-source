name: Build and create release

on:
  # Manual only: run from Actions > "Build and create release". Pushing a tag or
  # publishing a release directly does not start this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.8.0)'
        required: true
      overwrite:
        description: 'Replace assets that already exist on the release. Only allowed if the release is still a draft.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release binary
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OVERWRITE: ${{ github.event.inputs.overwrite == 'true' }}
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match v<major>.<minor>.<patch> (e.g. v2.8.0)"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: semeru
          cache: maven
      - name: Get project version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
      - name: Build
        run: mvn --batch-mode package
      # The job creates a DRAFT release with the jars; a maintainer reviews it and
      # publishes it in the GitHub UI. Re-runs may replace jars only while it is a draft.
      - name: Create draft release if it does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --title "Release $TAG" --generate-notes --verify-tag --draft \
              || gh release view "$TAG" >/dev/null   # tolerate a release created concurrently
          fi
      - name: Upload release assets
        run: |
          CLOBBER=""
          if [ "$OVERWRITE" = "true" ]; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::overwrite=true is only allowed on a draft release; $TAG is already published."
              exit 1
            fi
            echo "overwrite=true: release $TAG is a draft; existing assets will be replaced."
            CLOBBER="--clobber"
          fi
          gh release upload "$TAG" $CLOBBER \
            "target/kafka-connect-mq-source-${VERSION}-jar-with-dependencies.jar" \
            "target/kafka-connect-mq-source-${VERSION}-dependencies-exc-mq.jar" \
            "target/kafka-connect-mq-source-${VERSION}.jar"
