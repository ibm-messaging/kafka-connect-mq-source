name: Build and create release

on:
  # Two ways in:
  #  1. Push a tag (git push <remote> vX.Y.Z) that points at a commit on main.
  #  2. Run from Actions > "Build and create release" on main with a tag name;
  #     the tag is created from the tip of main if it does not exist.
  # Publishing a release directly in the UI does not start this workflow.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.8.0). Created from the tip of main if it does not exist yet.'
        required: true
      overwrite:
        description: 'Replace assets that already exist on the release. Only allowed if the release is still a draft.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release binary
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OVERWRITE: ${{ github.event.inputs.overwrite == 'true' }}
    steps:
      - name: Validate tag format and branch
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match v<major>.<minor>.<patch> (e.g. v2.8.0)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main. Choose 'Use workflow from: main' (got $GITHUB_REF)."
            exit 1
          fi
      - name: Check whether the tag already exists
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            # An existing tag must point at a commit that is on main
            # (compare status "behind" or "identical" means the tag is an ancestor of main).
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${TAG}" --jq .status)
            if [ "$STATUS" != "behind" ] && [ "$STATUS" != "identical" ]; then
              echo "::error::Tag $TAG is not on main (compare status: $STATUS). Releases are cut from main."
              exit 1
            fi
            echo "Tag $TAG exists and is on main; building from it."
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Tag $TAG does not exist; it will be created at ${GITHUB_SHA} (tip of main)."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Existing tag (re-run or recovery): build exactly what was tagged.
          # New tag: build the commit this run was started on (main).
          ref: ${{ env.TAG_EXISTS == 'true' && env.TAG || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: semeru
          cache: maven
      - name: Get project version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
      - name: Check pom version matches the tag
        run: |
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::pom.xml version is '$VERSION' but the tag is '$TAG'. Set the pom version to '${TAG#v}' on main first."
            exit 1
          fi
      - name: Build
        run: mvn --batch-mode package
      # The tag is created only after the build succeeds, so a failed build leaves no stray tag.
      - name: Create tag if it does not exist
        if: env.TAG_EXISTS == 'false'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "Created tag $TAG at ${GITHUB_SHA}."
      # The job creates a DRAFT release with the jars; a maintainer reviews it and
      # publishes it in the GitHub UI. Re-runs may replace jars only while it is a draft.
      - name: Create draft release if it does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --title "Release $TAG" --generate-notes --verify-tag --draft \
              || gh release view "$TAG" >/dev/null   # tolerate a release created concurrently
          fi
      - name: Upload release assets
        run: |
          CLOBBER=""
          if [ "$OVERWRITE" = "true" ]; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::overwrite=true is only allowed on a draft release; $TAG is already published."
              exit 1
            fi
            echo "overwrite=true: release $TAG is a draft; existing assets will be replaced."
            CLOBBER="--clobber"
          fi
          gh release upload "$TAG" $CLOBBER \
            "target/kafka-connect-mq-source-${VERSION}-jar-with-dependencies.jar" \
            "target/kafka-connect-mq-source-${VERSION}-dependencies-exc-mq.jar" \
            "target/kafka-connect-mq-source-${VERSION}.jar"
