name: Checkstyle and Tests

on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checkstyle and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: semeru
          cache: maven
      - name: Compile
        run: mvn --batch-mode compile
      - name: Checkstyle
        run: mvn --batch-mode validate
      - name: Test
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  verify-commits:
    name: Verify Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --invert-grep --grep='^Signed-off-by: .* <.*>' \
                      --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          if [ -n "$missing" ]; then
            echo "::error::These commits are missing a Signed-off-by line:"
            echo "$missing"
            exit 1
          fi
